<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booker Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
/* Booker concepts, round 3 (after two critic rounds). Base: the real v0.88 booking screen (tools/concepts/current/).
   ?v=wall  The Clock Wall   · time is the card, feud strings in the gutter, tension slip
   ?v=cork  The Corkboard    · the locker room's strings, loose threads you can drop on
   ?v=truck The Production Truck · storyboard, scene-first (rule 9c), three-frame plan of the picked segment
   Shared: roster left (drag rectangles: mouse, touch, pen, keys), card centre (move up/down), options right (tiles open pop-ups). */
:root{--board:#16181c;--paper:#f1ead6;--paper2:#e6dabd;--ink:#1b1b1d;--mut:#5f584b;--navy:#1f2a55;--marker:#ffd43b;
 --green:#2f8f45;--red:#c23b2a;--blue:#2c62ad;--yellow:#f2c230;--sticky:#fff27a;--sel:#ffe27a;--purple:#7a3fa0;
 --face:#2c62ad;--heel:#c23b2a;--fs:clamp(12px,0.84vw,27px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--board);color:var(--ink);font:var(--fs)/1.3 'Patrick Hand',system-ui,sans-serif;overflow:hidden;user-select:none;
 background-image:radial-gradient(#ffffff09 1px,transparent 1px),radial-gradient(#00000030 1px,transparent 1px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px}
button,input{font:inherit;color:inherit}
.m{font-family:'Permanent Marker',cursive;font-weight:400;letter-spacing:.02em}.gh{font-family:'Gochi Hand',cursive}
.app{display:grid;grid-template-rows:2.2em minmax(0,1fr) 2.5em;height:100vh}
.menu{display:flex;align-items:center;gap:1.4em;padding:0 1em;background:var(--paper);border-bottom:2px solid #000}
.menu span{font-family:'Permanent Marker';font-size:1.05em}.menu .on{background:var(--navy);color:var(--marker);padding:.05em .5em;transform:rotate(-.6deg)}
.menu .r{margin-left:auto;font-family:'Patrick Hand'}.menu .co{background:var(--red);color:#fff;font-family:'Permanent Marker';padding:0 .35em;margin-right:.5em}
.ww{filter:drop-shadow(0 3px 0 #000) drop-shadow(0 9px 12px #000a);min-height:0;display:flex}
.win{flex:1;background:var(--paper);background-image:radial-gradient(#00000008 1px,transparent 1.5px),linear-gradient(170deg,#ffffff40,transparent 40%);background-size:4px 4px,100% 100%;
 display:flex;flex-direction:column;min-height:0;clip-path:polygon(0 .5%,6% 0,20% .6%,38% .1%,55% .7%,72% 0,90% .5%,100% .2%,99.6% 40%,100% 99.5%,82% 100%,60% 99.4%,40% 100%,18% 99.5%,0 100%,.4% 50%)}
.wt{background:var(--navy);color:var(--marker);font-family:'Permanent Marker';padding:.15em .7em;margin:.45em .6em .3em;display:flex;gap:.8em;align-items:center;transform:rotate(-.25deg)}
.wt .t{flex:1;text-align:center;font-size:1.05em}.wt small{font-family:'Patrick Hand';color:#fff;font-size:.85em}
.wb{padding:.1em .8em .6em;min-height:0;display:flex;flex-direction:column;flex:1;gap:.4em}
.body{display:grid;grid-template-columns:minmax(0,22fr) minmax(0,45fr) minmax(0,33fr);gap:1em;padding:.7em 1em .6em;min-height:0}
.gold{color:#8a5f00;font-weight:700}.blue{color:var(--blue)}.bad{color:var(--red)}.good{color:var(--green)}.mut{color:var(--mut)}
.row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.btn{font-family:'Permanent Marker';border:0;padding:.2em .8em;cursor:pointer;color:#fff;background:var(--blue);box-shadow:2px 2px 0 #000;transform:rotate(-.7deg);transition:transform .3s,box-shadow .3s}
.btn:nth-child(2n){transform:rotate(.6deg)}.btn.gr{background:var(--green)}.btn.r{background:var(--red)}.btn.n{background:var(--navy);color:var(--marker)}.btn.k{background:#2b2b2b}
.btn:hover,.btn:focus-visible{transform:translateY(-2px) rotate(0);box-shadow:3px 5px 0 #000;outline:none}
.btn:focus-visible,.tile:focus-visible,.slot:focus-visible,.w:focus-visible,.piece:focus-visible,.loosenote:focus-visible{box-shadow:0 0 0 3px var(--marker),3px 4px 0 #000!important;outline:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.strip{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
/* roster */
.search{width:100%;border:2px solid #0003;background:#fffdf5;padding:.15em .5em}
.chips{display:flex;gap:.25em;flex-wrap:wrap}.chip{border:0;background:var(--paper2);padding:0 .55em;cursor:pointer;box-shadow:1px 1px 0 #0005}.chip.on{background:var(--navy);color:var(--marker)}
.list{overflow-y:auto;min-height:0;flex:1;padding:.15em .35em .3em .1em;scrollbar-width:thin;scrollbar-color:#9a8f72 transparent}
.w{display:grid;grid-template-columns:2.7em 1fr 4.6em;gap:.5em;align-items:center;background:#fffdf5;margin-bottom:.4em;padding:.25em .45em .25em .3em;
 box-shadow:2px 2px 0 #000;cursor:grab;border-left:.35em solid var(--face);transition:transform .3s,box-shadow .3s,opacity .3s;touch-action:none;position:relative}
.w.H{border-left-color:var(--heel)}
.w:hover{transform:translateX(5px) rotate(-.4deg);box-shadow:4px 4px 0 #000}
.w.held{outline:3px solid var(--marker);transform:translateX(8px) rotate(-.6deg)}
.w.on{opacity:.55}.w.on::after{content:'booked';position:absolute;right:.4em;top:-.3em;font-family:'Gochi Hand';color:var(--green);transform:rotate(-6deg)}
.w b{display:block;line-height:1.05}.w small{color:var(--mut);display:block;line-height:1.1}
.head{position:relative;width:2.7em;height:2.7em;background:#2a2a2a;display:grid;place-items:end center;overflow:hidden}
.head .ovr{position:absolute;right:0;top:0;background:var(--marker);color:#111;font-family:'Permanent Marker';font-size:.7em;padding:0 .25em}
.bars{display:grid;gap:.12em;font-size:.72em;line-height:1}
.bar{display:grid;grid-template-columns:2.6em 1fr;align-items:center;gap:.2em}.bar s{text-decoration:none;color:var(--mut)}.bar b{height:.55em;background:#0002;display:block;font-weight:400}.bar b i{display:block;height:100%}
.dots{display:flex;gap:.15em}.dots i{width:.55em;height:.55em;border-radius:50%;display:block}
/* match pieces */
.piece{position:relative;background:#fffdf5;box-shadow:2px 3px 0 #000;display:grid;grid-template-columns:2.4em 1fr 3em;gap:.5em;align-items:center;padding:.3em .5em .3em .2em;
 cursor:pointer;border:2px solid transparent;transition:transform .3s,box-shadow .3s,background .3s;touch-action:none}
.piece:hover{transform:translateX(5px) rotate(-.3deg);box-shadow:4px 4px 0 #000}
.piece.sel{border-color:var(--ink);background:var(--sel);transform:translateX(8px) rotate(-.4deg);box-shadow:5px 5px 0 #000;z-index:2}
.piece.seg{background:#efe6f6}.piece.seg.sel{background:var(--sel)}
.piece.ghosted{opacity:.3}
.piece.ins-top::before,.piece.ins-bot::after{content:'';position:absolute;left:0;right:0;height:5px;background:var(--marker);box-shadow:0 0 0 2px #000}
.piece.ins-top::before{top:-6px}.piece.ins-bot::after{bottom:-6px}
.grip{display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;cursor:grab;color:var(--mut);background:repeating-linear-gradient(0deg,transparent 0 3px,#0001 3px 5px);touch-action:none}
.when{font-family:'Permanent Marker';color:var(--blue);font-size:.82em}
.role{font-family:'Permanent Marker';font-size:.78em;color:var(--red);letter-spacing:.04em}.seg .role{color:var(--purple)}
.sides{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.slot{min-width:7em;min-height:1.75em;border:2px dashed #0005;display:flex;align-items:center;gap:.3em;padding:0 .4em;color:var(--mut);background:#fff;cursor:pointer;transition:background .3s,border-color .3s}
.slot.fill{border:2px solid #0002;color:var(--ink);border-left:.3em solid var(--face)}.slot.fill.H{border-left-color:var(--heel)}
.slot.hot{background:#fff6c6;border-color:var(--yellow)}.slot.want{background:#fffbe0;border-color:var(--yellow);animation:pulse 1s infinite alternate}
@keyframes pulse{to{background:#fff1a8}}
.slot .mini{width:1.3em;height:1.5em;background:#2a2a2a;display:grid;place-items:end center;overflow:hidden;flex:none}
.slot .x{margin-left:auto;border:0;background:none;color:var(--mut);cursor:pointer;padding:0 .1em}
.vs{font-family:'Permanent Marker';color:var(--red)}
.meta{font-size:.82em;color:var(--mut)}
.flag{font-size:.78em;padding:0 .3em;margin-left:.2em;color:#fff;background:#555;white-space:nowrap}.flag.r{background:var(--red)}.flag.gr{background:var(--green)}.flag.y{background:var(--yellow);color:#111}.flag.b{background:var(--blue)}
.mins{font-family:'Permanent Marker';text-align:right;line-height:1}.mins small{display:block;font-family:'Patrick Hand';color:var(--mut);font-size:.8em}
.dropnew{border:2px dashed #0005;padding:.35em;text-align:center;color:var(--ink);cursor:pointer;background:#fbfbf5;font-family:'Permanent Marker'}
.dropnew.hot{background:#fff6c6;border-color:var(--yellow)}
@keyframes settle{from{opacity:0;transform:translateY(-10px) rotate(-1.4deg)}to{opacity:1}}
.new{animation:settle .45s ease-out both}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(3deg);box-shadow:6px 8px 0 #0008;opacity:.95;background:#fffdf5;padding:.3em .7em;font-family:'Permanent Marker';border-left:.35em solid var(--face)}
/* right pane */
.rp{display:flex;flex-direction:column;gap:.45em;flex:1;min-height:0}
.mast{display:grid;grid-template-columns:4.4em 1fr auto 1fr 4.4em;align-items:center;gap:.4em}
.bust{height:4.4em;background:linear-gradient(#2a2d36 72%,#3a3a2a 72%);box-shadow:inset 0 0 0 3px #000,2px 2px 0 #000;display:grid;place-items:end center;overflow:hidden}
.who{font-family:'Permanent Marker';line-height:1.05}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4em}
.tile{border:0;text-align:left;background:#fbfbf5;padding:.2em .5em;box-shadow:2px 2px 0 #000;cursor:pointer;border-top:.55em solid #c9d7ef;transition:transform .3s,box-shadow .3s;line-height:1.15}
.tile:nth-child(3n){transform:rotate(-.5deg)}.tile:nth-child(3n+1){transform:rotate(.4deg)}
.tile:hover{transform:translateY(-2px) rotate(0);box-shadow:3px 4px 0 #000}
.tile small{display:block;font-family:'Permanent Marker';font-size:.72em;color:var(--red);letter-spacing:.05em}
.tile span{display:block;font-size:.8em;color:var(--mut)}
.tile.set{border-top-color:var(--yellow)}.tile.cost{border-top-color:var(--red)}
.sticky{background:var(--sticky);padding:.35em .6em;box-shadow:2px 4px 6px #0007;transform:rotate(-.8deg);font-family:'Gochi Hand';font-size:1.05em;line-height:1.2}
.sticky b{font-family:'Permanent Marker';font-size:.75em;display:block;color:#5a4a00}
.knock{background:#fff;border-left:.4em solid var(--red);padding:.35em .6em;box-shadow:2px 2px 0 #000;overflow:auto;min-height:0;flex:1}
.knock h4{margin:0 0 .25em;font-family:'Permanent Marker';font-weight:400;font-size:.9em;display:flex;justify-content:space-between}
.knock ul{margin:0;padding:0}.knock li{list-style:none;margin:.12em 0;padding:.12em .35em;font-size:1.02em;transition:opacity .3s}
.knock li.dim{opacity:.5}.knock li.mine{background:linear-gradient(transparent 15%,#fff27a 15%,#fff27a 85%,transparent 85%)}
.knock .sec{font-family:'Permanent Marker';font-size:.72em;color:var(--mut);margin:.35em 0 .1em}
.odds{display:flex;height:1.25em;box-shadow:inset 0 0 0 2px #0003}.odds i{display:grid;place-items:center;color:#fff;font-style:normal;font-size:.8em;white-space:nowrap;overflow:hidden}
.ruleline{font-size:.78em;color:var(--mut);margin-top:-.25em}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40}
.pop{background:var(--paper);padding:1em 1.2em;box-shadow:0 4px 0 #000,0 14px 30px #000;min-width:28em;max-width:46em;transform:rotate(-.4deg);animation:settle .3s ease-out both}
.pop h3{margin:0 0 .6em;font-family:'Permanent Marker';font-weight:400;background:var(--navy);color:var(--marker);padding:.1em .6em;display:inline-block}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em}
.note{border:0;background:var(--sticky);padding:.5em .6em;text-align:left;cursor:pointer;box-shadow:2px 3px 4px #0006;font-family:'Gochi Hand';font-size:1.1em;line-height:1.15;transition:transform .3s}
.note:nth-child(odd){transform:rotate(-1deg)}.note:nth-child(even){transform:rotate(1deg)}.note:hover,.note:focus-visible{transform:translateY(-3px) rotate(0);outline:3px solid var(--navy)}
.note.on{background:#c8f0c0}.note small{display:block;font-family:'Patrick Hand';font-size:.8em;color:#5a5030}
/* bottom */
.bottom{display:flex;align-items:center;gap:.6em;padding:0 1em;background:var(--paper);border-top:2px solid #000;white-space:nowrap}
.stat{background:#fffdf5;box-shadow:1px 1px 0 #0006;padding:0 .5em}.stat b{color:var(--red)}
.keys{margin-left:auto;display:flex;gap:.4em}.key{background:var(--blue);color:#fff;font-family:'Permanent Marker';font-size:.85em;padding:0 .5em}
.space{background:var(--red);color:#fff;font-family:'Permanent Marker';font-size:1.05em;padding:.05em 1em;box-shadow:2px 2px 0 #000;border:0;cursor:pointer}.space.go{background:var(--green)}
.toast{position:fixed;left:50%;bottom:3.4em;transform:translateX(-50%);background:var(--sticky);padding:.3em .9em;font-family:'Gochi Hand';font-size:1.15em;box-shadow:2px 3px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.cap{position:fixed;right:.6em;top:2.4em;z-index:30;background:#000c;color:var(--marker);font:600 11px system-ui;padding:.2em .6em}.cap a{color:#ddd;margin-left:.6em}
/* gutter strings (wall + cork) */
.gutter{position:relative}.gutter svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
/* ---------- WALL ---------- */
.wallwrap{display:grid;grid-template-columns:3.6em 1fr 3.2em;gap:.4em;flex:1;min-height:0;position:relative}
.ruler{position:relative;background:#fbfbf5;box-shadow:2px 2px 0 #000}
.ruler span{position:absolute;left:0;right:0;border-top:1px solid #0003}
.ruler span.q{border-top:2px solid #000a}.ruler span.h{border-top:3px solid #000}
.ruler span em{font-style:normal;font-family:'Permanent Marker';font-size:.9em;padding-left:.2em;position:relative;top:-.15em}
.crowdtag{position:absolute;left:-.3em;right:-1.6em;background:var(--sticky);font-family:'Gochi Hand';font-size:.95em;padding:.05em .3em;box-shadow:1px 2px 3px #0007;transform:rotate(-3deg);z-index:4;line-height:1.1}
.wall{display:flex;flex-direction:column;position:relative;min-height:0}
.wall .piece{margin:0 0 3px;min-height:2.2em;overflow:hidden;align-items:start;padding-top:.2em}
.wall .piece .mins{align-self:center}
.wall .piece.short{align-items:center;padding-top:0}
.short .meta,.short .role{display:none}.short .slot{min-height:1.4em}.short .when{display:none}
.more{font-size:.75em;background:#555;color:#fff;padding:0 .3em;margin-left:.3em}
.wall .empty{background:#fbfbf5;background-image:repeating-linear-gradient(45deg,#c23b2a14 0 10px,transparent 10px 20px);border:3px dashed var(--red);display:grid;place-items:center;min-height:2.6em;cursor:pointer;text-align:center;line-height:1.1}
.wall .empty b{font-family:'Permanent Marker';font-size:1.45em;color:var(--red);display:block}
.wall .empty.hot{background-color:#fff6c6}
.cut{position:absolute;left:-4.2em;right:-3.6em;height:0;border-top:4px dashed var(--red);z-index:3;pointer-events:none}
.cut span{position:absolute;right:3.6em;top:-1.45em;background:var(--red);color:#fff;font-family:'Permanent Marker';font-size:.8em;padding:0 .4em}
.cut.end{border-top-style:dashed}.cut.over{border-top-style:solid}
/* ---------- CORK ---------- */
.vcork .w{grid-template-columns:3em 1fr 4.6em;border-left:0;background:#fff;padding:.3em .4em .45em .3em;margin:0;gap:.45em;align-items:center;box-shadow:2px 3px 0 #000,inset 0 0 0 1px #0001}
.vcork .list{display:grid;grid-template-columns:1fr;gap:.45em;align-content:start}
.vcork .w b{font-size:.9em!important}.vcork .w small{font-size:.8em!important}
.opencard{display:block;width:100%;border:3px dashed var(--red);background:#fbfbf5;background-image:repeating-linear-gradient(45deg,#c23b2a14 0 10px,transparent 10px 20px);padding:.5em;text-align:center;cursor:pointer;transform:rotate(-.6deg);box-shadow:2px 3px 0 #000;margin:.2em 0 .6em;font-family:'Gochi Hand';font-size:1.05em}
.opencard b{display:block;font-family:'Permanent Marker';font-size:1.4em;color:var(--red)}.opencard.hot{background-color:#fff6c6}
.yarnline{position:relative;height:0;border-top:5px solid var(--red);margin:.6em -.3em .4em;box-shadow:0 2px 0 #0006}.yarnline span{position:absolute;right:.3em;top:-1.6em;background:var(--red);color:#fff;font-family:'Permanent Marker';font-size:.8em;padding:0 .4em}
.filerow{display:block;width:100%;text-align:left;border:0;background:#fbfbf5;box-shadow:2px 2px 0 #000;padding:.2em .5em;border-left:.35em solid var(--face);cursor:pointer;margin-bottom:.3em;transition:transform .3s}
.filerow.H{border-left-color:var(--heel)}.filerow:hover,.filerow:focus-visible{transform:translateX(4px)}
.vcork .w:nth-child(4n+1){transform:rotate(-1deg)}.vcork .w:nth-child(4n+2){transform:rotate(.8deg)}.vcork .w:nth-child(4n+3){transform:rotate(.5deg)}.vcork .w:nth-child(4n){transform:rotate(-.6deg)}
.vcork .w:hover{transform:translateY(-3px) rotate(0)}
.vcork .w .head{width:3em;height:3em;border-bottom:.3em solid var(--face)}.vcork .w.H .head{border-bottom-color:var(--heel)}
.vcork .w b{font-family:'Permanent Marker';line-height:1.05}
.vcork .knock .w{grid-template-columns:2.7em 1fr 4.6em;transform:none;border-left:.35em solid var(--face);align-items:center}.vcork .knock .w.H{border-left-color:var(--heel)}
.vcork .knock .w .head{width:2.7em;height:2.7em;border-bottom:0}
.corkwrap{display:grid;grid-template-columns:1fr 3.4em;gap:.3em;flex:1;min-height:0;background:#a87b4f;
 background-image:radial-gradient(#5a3d1f55 1px,transparent 1.6px),radial-gradient(#d9b28a55 1px,transparent 1.4px),radial-gradient(#3d2a1533 2px,transparent 2.5px);background-size:6px 6px,9px 9px,14px 14px;background-position:0 0,3px 4px,7px 2px;
 box-shadow:inset 0 0 0 4px #5a3d1f,inset 0 0 18px #0006;padding:.6em .4em .3em .6em}
.corkcol{overflow:auto;min-height:0;padding:.3em .3em .3em .1em}
.vcork .piece{background:#fbfbf5;background-image:linear-gradient(transparent 1.45em,#cfe0f5 1.45em,#cfe0f5 calc(1.45em + 1px),transparent calc(1.45em + 1px));margin-bottom:.45em}
.vcork .piece::before{content:'';position:absolute;top:-.35em;left:50%;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#a5221a);box-shadow:1px 2px 2px #0008}
.vcork .piece:nth-child(odd){transform:rotate(-.5deg)}.vcork .piece:nth-child(even){transform:rotate(.4deg)}
.vcork .piece.sel{transform:translateX(8px) rotate(-.3deg)}
.loosebar{height:18%;min-height:5.5em;display:flex;gap:.7em;align-items:stretch;padding:.3em .2em 0}
.loosenote{flex:1;border:0;background:var(--sticky);font-family:'Gochi Hand';font-size:1.08em;text-align:left;padding:.35em .55em;box-shadow:2px 4px 6px #0008;cursor:pointer;line-height:1.15;border-top:.5em solid var(--c);transition:transform .3s}
.loosenote:nth-child(odd){transform:rotate(-2deg)}.loosenote:nth-child(even){transform:rotate(1.6deg)}
.loosenote:hover,.loosenote.hot{transform:translateY(-4px) rotate(0);background:#fff7b0}
.loosenote b{display:block;font-family:'Permanent Marker';font-size:.72em;color:#5a4a00}
.filecard{background:#fbfbf5;box-shadow:2px 2px 0 #000;padding:.25em .5em;border-left:.35em solid var(--face);font-size:.95em}
.filecard.H{border-left-color:var(--heel)}.filecard b{font-family:'Permanent Marker';font-size:.85em}
.files{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
/* ---------- TRUCK ---------- */
.vtruck .piece{grid-template-columns:2.4em 8.4em 1fr 3em;margin-bottom:.45em}
.thumb{height:4.4em;background:#20232b;box-shadow:inset 0 0 0 3px #000,2px 2px 0 #000;position:relative;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.thumb .lab{position:absolute;left:.25em;bottom:.1em;font-family:'Gochi Hand';color:#fff;font-size:.8em;text-shadow:0 1px 2px #000}
.hands{font-family:'Gochi Hand';color:#3d1a5c;font-size:1.02em}
.agentline{font-family:'Gochi Hand';color:#1f3f75;font-size:1em}
.vwall .frames{grid-column:2/3}.vwall .frame .thumb{height:4.6em}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:'Permanent Marker';padding:0 .5em;transform:rotate(-4deg);background:#fff8}
.stamp.wig{animation:wig .5s}@keyframes wig{0%,100%{transform:rotate(-4deg)}30%{transform:rotate(4deg) scale(1.1)}60%{transform:rotate(-7deg)}}
.glabel{position:absolute;top:-1.5em;left:0;right:0;text-align:center;font-family:'Permanent Marker';font-size:.75em;color:var(--marker);background:var(--navy);transform:rotate(-2deg)}

/* ---------- actions ---------- */
function unbook(wid){for(const m of card){if(m.k==='m')m.sides.forEach(s=>s.forEach((x,k)=>{if(x===wid)s[k]=null}));else m.who=m.who.filter(x=>x!==wid)}}
function put(wid,key){const [u,si,xi]=key.split(':').map(Number);const c=card.find(x=>x.uid===u);const prev=c.sides[si][xi];unbook(wid);c.sides[si][xi]=wid;sel=u;held=null;fresh=u;toast(W(wid).n+(prev!=null?' replaces '+W(prev).n:' is booked'));render()}
function newMatch(wid){unbook(wid);const m=M('Singles',[[wid],[null]]);card.push(m);sel=m.uid;fresh=m.uid;held=null;render.scroll=true;render();toast('New match. Now pick an opponent.')}
function bookFeud(k){const f=FEUDS[k];unbook(f.a);unbook(f.b);const m=M('Singles',[[f.a],[f.b]],f.belt?{title:f.belt}:{});const me=card.findIndex(c=>role(c)==='Main event');card.splice(me<0?card.length:me,0,m);sel=m.uid;fresh=m.uid;held=null;render.scroll=true;render();toast(`${W(f.a).n} vs ${W(f.b).n} is on the card`)}
function move(u,to){const f=card.findIndex(c=>c.uid===u);if(f<0||to<0||to>=card.length||f===to)return;const [c]=card.splice(f,1);card.splice(to,0,c);fresh=u;render()}
function reshape(c,mt){const old=c.sides.flat().filter(x=>x!=null);c.mt=mt;c.sides=SIZE[mt].map(n=>Array(n).fill(null));let k=0;c.sides.forEach(s=>s.forEach((_,j)=>{s[j]=old[k++]??null}));c.call=-1}
function openTile(k){const c=card.find(x=>x.uid===sel);let ch=[];
 if(k==='mt')ch=OPT.mt.map(x=>[x,SIZE[x].join(' vs ')+' wrestlers',x===c.mt]);if(k==='len')ch=OPT.len.map((x,i)=>[x,NOTE.len[i],i===c.len]);
 if(k==='stip')ch=OPT.stip.map(x=>[x,NOTE.stip[x],x===c.stip]);if(k==='title')ch=OPT.title.map(x=>[x,x==='No title'?'nothing on the line':'on the line tonight',x===c.title]);
 if(k==='how')ch=OPT.how.map((x,i)=>[x,NOTE.how[i],x===c.how]);
 if(k==='call')ch=[['Let it play out','free · the ring decides',c.call<0]].concat(done(c)?c.sides.map((s,i)=>[sideName(s)+' wins',(i===0?1:2)+' booking power',c.call===i]):[]);
 if(k==='segk')ch=OPT.segk.map(x=>[x,'plays its own scene',x===c.segk]);if(k==='smins')ch=[5,10,15].map(x=>[x+' min','',x===c.mins]);
 const L={mt:'Type',len:'Length',stip:'Rules',title:'Title',how:'Ending',call:'Finish',segk:'Kind',smins:'Length'}[k];
 document.getElementById('modal').innerHTML=`<div class="modal" data-bg="1"><div class="pop" role="dialog" aria-label="${L}"><h3>${L}</h3><div class="pick">${ch.map((x,i)=>`<button class="note ${x[2]?'on':''}" data-choose="${k}:${i}">${x[0]}<small>${x[1]}</small></button>`).join('')}</div><div class="row" style="margin-top:.8em;justify-content:flex-end"><button class="btn k" data-closepop="1">Close</button></div></div></div>`;
 (document.querySelector('.note.on')||document.querySelector('.note')).focus()}
function choose(k,i){const c=card.find(x=>x.uid===sel);
 if(k==='mt')reshape(c,OPT.mt[i]);else if(k==='len')c.len=i;else if(k==='stip')c.stip=OPT.stip[i];else if(k==='title')c.title=OPT.title[i];else if(k==='how')c.how=OPT.how[i];
 else if(k==='call')c.call=i-1;else if(k==='segk')c.segk=OPT.segk[i];else if(k==='smins')c.mins=[5,10,15][i];
 document.getElementById('modal').innerHTML='';fresh=c.uid;render.focus=`[data-tile="${k}"]`;render()}
document.addEventListener('click',e=>{const t=e.target;if(dragging)return;
 if(t.dataset.bg||t.closest('[data-closepop]')){document.getElementById('modal').innerHTML='';return}
 const ch=t.closest('[data-choose]');if(ch){const [k,i]=ch.dataset.choose.split(':');choose(k,+i);return}
 const rm=t.closest('[data-rm]');if(rm){const [u,si,xi]=rm.dataset.rm.split(':').map(Number);card.find(c=>c.uid===u).sides[si][xi]=null;fresh=u;render();return}
 const rs=t.closest('[data-rmseg]');if(rs){const [u,w]=rs.dataset.rmseg.split(':').map(Number);const c=card.find(x=>x.uid===u);c.who=c.who.filter(x=>x!==w);render();return}
 const f=t.closest('[data-filt]');if(f){filt=f.dataset.filt;render();return}
 const tl=t.closest('[data-tile]');if(tl){openTile(tl.dataset.tile);return}
 const lf=t.closest('[data-dropfeud]');if(lf){bookFeud(+lf.dataset.dropfeud);return}
 const fl=t.closest('[data-file]');if(fl){const x=+fl.dataset.file,w=W(x),f=FEUDS.find(q=>q.a===x||q.b===x);
  document.getElementById('modal').innerHTML=`<div class="modal" data-bg="1"><div class="pop" role="dialog" aria-label="${w.n}"><h3>${w.n}</h3><div style="display:grid;grid-template-columns:7em 1fr;gap:1em"><div class="bust" style="height:9em">${bustSVG(w)}</div><div>
   <div><b>${w.s==='F'?'Face':'Heel'} · ${w.st} · ${w.o}</b>${w.ch?' · <span class="gold">'+BELT[w.ch]+'</span>':''}</div>
   <div>${f?`<span style="color:${f.c}">●</span> Feud with <b>${W(f.a===x?f.b:f.a).n}</b>, ${f.heat}.`:'No feud running.'}</div><div>Friend: <b>${FRIENDS[x]||'nobody close'}</b>.</div>
   <div>Body ${w.cond<65?'<b class="bad">worn down</b>':'fresh'} · Mood <b>${['','low','fine','high'][w.mood]}</b></div>
   <div class="sticky" style="margin-top:.5em"><b>What he remembers about you</b>${w.mood===1?'Being left off last week\'s show.':x===PROMISE.w?'You promised him a win.':'Your last call went his way.'}</div></div></div>
   <div class="row" style="margin-top:.8em;justify-content:flex-end"><button class="btn k" data-closepop="1">Close</button></div></div></div>`;document.querySelector('[data-closepop]').focus();return}
 const pk=t.closest('[data-pick]');if(pk){sel=+pk.dataset.pick;render.scroll=true;render();return}
 const fw=t.closest('[data-fit]');if(fw){put(+fw.dataset.w,fw.dataset.fit);return}
 const w=t.closest('[data-w]');if(w){held=held===+w.dataset.w?null:+w.dataset.w;render();if(held!=null)toast('Now press a spot on the card');return}
 const d=t.closest('[data-drop]');if(d&&held!=null){put(held,d.dataset.drop);return}
 const dn=t.closest('[data-dropnew]');if(dn){if(held!=null)newMatch(held);else{const m=M('Singles',[[null],[null]]);card.push(m);sel=m.uid;fresh=m.uid;render.scroll=true;render()}return}
 const ds=t.closest('[data-dropseg]');if(ds&&held!=null){const c=card.find(x=>x.uid===+ds.dataset.dropseg);unbook(held);c.who.push(held);held=null;fresh=c.uid;render();return}
 const p=t.closest('.piece');if(p&&!t.closest('button')){if(sel!==+p.dataset.uid){sel=+p.dataset.uid;render()}return}
 const a=t.closest('[data-act]');if(!a)return;const c=card.find(x=>x.uid===sel),i=card.indexOf(c);
 switch(a.dataset.act){case'up':move(sel,i-1);break;case'down':move(sel,i+1);break;
  case'remove':card.splice(i,1);sel=card[Math.min(i,card.length-1)]?.uid;render();break;
  case'next':sel=card[(i+1)%card.length].uid;render.scroll=true;render();break;
  case'addm':{const m=M('Singles',[[null],[null]]);card.push(m);sel=m.uid;fresh=m.uid;render.scroll=true;render();break}
  case'addp':{const s=SG('Promo: Call-out',[],5);card.splice(Math.max(0,card.length-1),0,s);sel=s.uid;fresh=s.uid;render();break}
  case'adda':{const s=SG('Angle: Brawl',[],10);card.splice(Math.max(0,card.length-1),0,s);sel=s.uid;fresh=s.uid;render();break}
  case'clear':card=[];sel=null;render();break;
  case'suggest':card.forEach(c=>{if(c.k==='m')c.sides.forEach(s=>s.forEach((x,k)=>{if(x==null){const fr=R.filter(w=>!booked().has(w.id)).sort((p,q)=>q.o-p.o)[0];if(fr)s[k]=fr.id}}))});render();toast('Filled the empty spots');break;
  case'space':toast(a.textContent.includes('bell')?'The show goes on the air':a.textContent.replace('SPACE ▸ ',''));break}});
/* ---------- pointer drag (mouse, touch, pen) ---------- */
let dragging=null,start=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h||e.target.closest('.x'))return;start={x:e.clientX,y:e.clientY,h}});
document.addEventListener('pointermove',e=>{if(!start)return;if(!dragging){if(Math.hypot(e.clientX-start.x,e.clientY-start.y)<7)return;
  const h=start.h,kind=h.dataset.drag;let label='',info={};
  if(kind==='w'){info={k:'w',wid:+h.dataset.w};label=W(info.wid).n}
  else if(kind==='chip'){const [u,si,xi]=h.dataset.chip.split(':').map(Number);info={k:'w',wid:card.find(c=>c.uid===u).sides[si][xi],from:h.dataset.chip};label=W(info.wid).n}
  else{info={k:'piece',uid:+h.dataset.grip};const c=card.find(x=>x.uid===info.uid);label=role(c)+' · '+(c.k==='m'?c.sides.map(sideName).join(' vs '):c.segk);h.closest('.piece').classList.add('ghosted')}
  const g=document.createElement('div');g.className='ghost';g.textContent=label;if(info.k==='w')g.style.borderLeftColor=W(info.wid).s==='F'?'#2c62ad':'#c23b2a';document.body.appendChild(g);dragging={...info,g}}
 dragging.g.style.left=e.clientX+12+'px';dragging.g.style.top=e.clientY+8+'px';
 document.querySelectorAll('.hot,.ins-top,.ins-bot').forEach(n=>n.classList.remove('hot','ins-top','ins-bot'));
 const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;
 if(dragging.k==='w'){const d=el.closest('[data-drop],[data-dropnew],[data-dropseg],[data-dropfeud]');if(d)d.classList.add('hot')}
 else{const p=el.closest('.piece');if(p){const r=p.getBoundingClientRect();p.classList.add(e.clientY<r.top+r.height/2?'ins-top':'ins-bot')}}
 const sh=document.getElementById('sheet');if(sh){const r=sh.getBoundingClientRect();if(e.clientY<r.top+30)sh.scrollTop-=12;else if(e.clientY>r.bottom-30)sh.scrollTop+=12}});
document.addEventListener('pointerup',e=>{const d=dragging;start=null;if(!d)return;d.g.remove();dragging='done';setTimeout(()=>{if(dragging==='done')dragging=null},0);
 const el=document.elementFromPoint(e.clientX,e.clientY);document.querySelectorAll('.ghosted').forEach(n=>n.classList.remove('ghosted'));if(!el){render();return}
 if(d.k==='w'){const slot=el.closest('[data-drop]'),dn=el.closest('[data-dropnew]'),ds=el.closest('[data-dropseg]'),lf=el.closest('[data-dropfeud]'),li=el.closest('#list');
  if(slot){if(d.from){const [u,si,xi]=slot.dataset.drop.split(':').map(Number),[fu,fs,fx]=d.from.split(':').map(Number);const c=card.find(x=>x.uid===u),fc=card.find(x=>x.uid===fu);const prev=c.sides[si][xi];c.sides[si][xi]=d.wid;fc.sides[fs][fx]=prev;sel=u;fresh=u;render();toast(prev!=null?'Swapped':'Moved')}else put(d.wid,slot.dataset.drop)}
  else if(lf)bookFeud(+lf.dataset.dropfeud);else if(dn)newMatch(d.wid);else if(ds){const c=card.find(x=>x.uid===+ds.dataset.dropseg);unbook(d.wid);c.who.push(d.wid);sel=c.uid;fresh=c.uid;render()}
  else if(li&&d.from){unbook(d.wid);toast(W(d.wid).n+' is off the card');render()}else render()}
 else{const p=el.closest('.piece');if(p&&+p.dataset.uid!==d.uid){const r=p.getBoundingClientRect();let to=card.findIndex(c=>c.uid===+p.dataset.uid)+(e.clientY>r.top+r.height/2?1:0);const f=card.findIndex(c=>c.uid===d.uid);if(f<to)to--;sel=d.uid;move(d.uid,to);toast('Moved')}else render()}});
/* ---------- keys and pad (rule 5) ---------- */
document.addEventListener('keydown',e=>{const md=document.querySelector('.modal');if(md){if(e.key==='Escape')document.getElementById('modal').innerHTML='';
  if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){const ns=[...md.querySelectorAll('.note')],k=ns.indexOf(document.activeElement);const d=e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1;ns[(k+d+ns.length)%ns.length].focus();e.preventDefault()}return}
 if(e.target.tagName==='INPUT')return;const i=card.findIndex(c=>c.uid===sel);
 if(e.altKey&&e.key==='ArrowDown'){render.focus='.piece.sel';move(sel,i+1);e.preventDefault()}
 else if(e.altKey&&e.key==='ArrowUp'){render.focus='.piece.sel';move(sel,i-1);e.preventDefault()}
 else if(e.key===']'&&card[i+1]){sel=card[i+1].uid;render.scroll=true;render()}else if(e.key==='['&&card[i-1]){sel=card[i-1].uid;render.scroll=true;render()}
 else if(e.key==='Enter'||e.key===' '){const fr=document.activeElement&&document.activeElement.closest('[data-fit]');if(fr){render.focus='.piece.sel button.slot, [data-tile="call"]';put(+fr.dataset.w,fr.dataset.fit);e.preventDefault();return}
  const w=document.activeElement&&document.activeElement.closest('[data-w]');if(w){held=+w.dataset.w;render();const s=document.querySelector('.slot.want');if(s)s.focus();toast('Now press a spot on the card');e.preventDefault();return}
  const p=document.activeElement&&document.activeElement.classList.contains('piece')?document.activeElement:null;if(p){sel=+p.dataset.uid;render.focus='.piece.sel';render();e.preventDefault()}}
 else if(e.key==='Escape'){held=null;render()}});
render();
</script></body></html>

	<script type="text/javascript">

		cl('starting with '+cpdCore.env+' environment');
		
		cpdCore.UI.initLoading=true;

		cpdCore.UI.userOptions=new cpdCore.models.UserOptions();											//we need user options before anything else

		var w=new cpdCore.views.WindowBar();

		if(navigator.onLine)
		{
			var intro=new cpdCore.views.Welcome();
		}
		else
		{
			var b=new cpdCore.views.BigMessage({message: '[ currently offline | waiting for connection ]', diagWidth:600});

			$(window).on('online',function(e){
				var b=new cpdCore.views.BigMessage({message: '[ connection established ]', diagWidth:600});

				setTimeout(function(){b.hideDialog()},cpdCore.data.dialogTimeout);
				setTimeout(function(){location.reload()},cpdCore.data.dialogTimeout+1000);
			});
		}

		$(window).on('offline',function(e){
			
			cpdCore.server.cancelOpenXHR();

			var b=new cpdCore.views.BigMessage({message: '[ internet connection lost ]', diagWidth:600});
			
			var tO=setTimeout(function(){
				var b=new cpdCore.views.BigMessage({message: '[ waiting to reconnect ]', diagWidth:600});
			},1500);

			$(window).on('online',function(e){
				
				clearTimeout(tO);

				cpdCore.server.resync('[ connection established | resyncing local game state with server ]');
				
				$(window).off('online');
			});
		});

		$(window).on('mousemove', function (e) {

			if(!cpdCore.UI.followerTipLocked)
			{
				var x=e.clientX,
					y=e.clientY,
					h=parseInt(cpdCore.UI.followerTip.css('height'),10),
					w=parseInt(cpdCore.UI.followerTip.css('width'),10),
					wW=window.innerWidth,
					wH=window.innerHeight;

				var totalOffsetX=x+30;
				var totalOffsetY=y-(h/2);

				if((totalOffsetX+w)>(wW-20))
					totalOffsetX=x-(40+w);

				if((y+(h/2))>(wH-30))
					totalOffsetY-=(y+(h/2)-(wH-30));

				if((y-(h/2))<70)
					totalOffsetY+=(70-(y-(h/2)));
	
				cpdCore.UI.followerTip.css({top: totalOffsetY+'px', left: totalOffsetX+'px'});
			}

			cpdCore.UI.followTipValid=true;																	//only enable if the mouse has moved at least once
		});

		$(window).
			keydown(
				function(e){
					
					if(e.which==13 && cpdCore.UI.gameState!=false && cpdCore.UI.gameState.get('openCard')!=false)		//block holding down enter
						e.preventDefault();

					cpdCore.UI.keyPressed=e.which;}
			).
			keyup(
				function(e){cpdCore.UI.handleKeyPress(e);}
			);

	</script>
